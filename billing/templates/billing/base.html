{% extends "auth/base.html" %}
{% block content %}

    <a href="{{ url_for('auth.dashboard_page') }}">Dashboard</a>
    <a href="{{ url_for('billing.pricing') }}">Plans</a>
    <a href="{{ url_for('billing.membership') }}">Membership</a>
</nav>
<section id="billing-root" data-csrf="{{ csrf }}">

{% block payment_assets %}{% endblock %}
<script src="{{ url_for('billing.static', filename='js/billing.js') }}" defer></script>
{% endblock %}
