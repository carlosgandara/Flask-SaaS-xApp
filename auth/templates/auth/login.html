{% extends "auth/base.html" %}
{% block content %}
<h2>Login</h2>
<p><a href="{{ url_for('auth.resend_page') }}">Need a new verification email?</a></p>
<form id="login-form">
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
</form>
<p id="msg"></p>
<p><a href="/register">Register</a> | <a href="/forgot-password">Forgot?</a></p>
{% endblock %}
